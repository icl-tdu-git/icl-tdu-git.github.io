  image_alt: 研究室の集合写真
about:
  title: 人のように世界を理解するコンピュータを目指して
  text: |-
    人間は画像，映像，音声，文字など様々な情報から柔軟に世界を理解していますが，
    コンピュータに同じことをさせるのは簡単ではありません．
    本研究室では，コンピュータをより知的に進化させることを目指して，
    コンピュータビジョンやパターン認識，機械学習等に関する研究を行っています．
# リストの順序が、そのまま表示順になります。
fields:
  - title: 画像解析・認識
    text: 手描きイラストや多様な撮影条件の自然画像から有意な特徴を抽出
    image: img/index/detect.jpg
    image_alt: 画像解析・認識の研究例
  - title: 画像生成・変換
    text: 人手での作成が困難な画像を０から，もしくは既存の画像から自動で生成
    image: img/index/generation.jpg
    image_alt: 画像生成・変換の研究例
