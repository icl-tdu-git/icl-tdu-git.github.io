about:
  title: 人のように世界を理解するコンピュータを目指して
  text: |-
    人間は画像，映像，音声，文字など様々な情報から柔軟に世界を理解していますが，
    コンピュータに同じことをさせるのは簡単ではありません．
    本研究室では，コンピュータをより知的に進化させることを目指して，
    コンピュータビジョンやパターン認識，機械学習等に関する研究を行っています．
# リストの順序が、そのまま表示順になります。
